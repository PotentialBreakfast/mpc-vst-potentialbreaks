art file=skin/looks/_bg_print.svg
frame x=14 y=100 w=1252 h=604 title="MANUAL"
enum_h cx=640 cy=166 label="" key=manual_page sw=190 sh=56 rows=1
text cx=60 cy=240 label="POTENTIALBREAKS: DIG, CHOP, PLAY" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:0
text cx=60 cy=280 label="One tap for a random drum break from your own library, sliced across 16 pads and matched to your project's" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=312 label="tempo." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=360 label="Load it as a plugin instrument (a plugin program). The pads play the slices." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=392 label="Put your breaks in a folder called DRUM BREAKS LIBRARY at the top of an SD card, USB drive or SSD. WAV and" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=84 cy=424 label="FLAC." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=456 label="Tap RANDOM BREAK, or ROLL for a random break played a random way." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=488 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=488 label="SAVE KIT turns the 16 pads into a real MPC drum program." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=536 label="The full PotentialSuite manual: github.com/PotentialBreakfast/potential-plugins" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=240 label="CONTROLS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:1
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=280 label="RANDOM BREAK picks a break. PREV and NEXT step through them. LIBRARY switches folders." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=312 label="BROWSE page: 10 breaks at a time, tap the one you want. RESCAN after adding folders." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=344 label="ROLL: a random break and a random chop, loop length, pad order and pitch. MILD, MEDIUM or WILD sets how far" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=84 cy=376 label="it goes." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=408 label="CHOP: 8 or 16 even slices on the beat (moved onto the nearest hit), or the 16 strongest hits." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=440 label="TEMPO: Re-pitch speeds the break up or down to your tempo like an old sampler. Stretch keeps each slice at" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=84 cy=472 label="its own pitch and cuts it to length." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=504 label="SHUFFLE re-deals the slices across the pads. ORDER puts them back." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=536 label="PLAY LOOP (or the pad after pad 16) plays the whole loop." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=568 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=568 label="CHOKE, PITCH (12 semitones each way) and VOLUME." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=60 cy=240 label="SAVING YOUR WORK" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:2
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=280 label="Your project remembers the break, the chop, the pad order and the settings." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=312 label="SAVE GROOVE writes a MIDI file of the break's original slice order, to load into a sequence." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=344 label="SAVE KIT writes an MPC drum program: each pad as a WAV, as you hear it, on pads A01 to A16, with the groove" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=84 cy=376 label="beside it as a MIDI file. Load it like any program and keep it after the plugin is gone. MPC OS 3.10.1 or" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=84 cy=408 label="later." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=440 label="Kits go to PotentialBreaks/Kits on the drive your breaks are on. Grooves go to the PotentialBreaks folder" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=84 cy=472 label="there." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=60 cy=524 label="WHERE IT FINDS YOUR BREAKS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:2
text cx=62 cy=564 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=564 label="A folder called DRUM BREAKS LIBRARY at the top of any drive." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=596 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=596 label="Any folder at the top of a drive with break in its name." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=628 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=628 label="Folders you list in PotentialBreaks/folders.txt on the breaks drive, one per line." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=60 cy=240 label="WITH THE OTHER PLUGINS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:3
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=280 label="Break Bus chain on the break's track: Punch > Grit > Bleed > Patina, the same preset name in each." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=312 label="Drum-bus pair: Punch > Heat, the same name in each (Boom Bap Bus, Lo-Fi Bus, Modern Bus or Glue Bus)." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=344 label="PotentialWarp as the last insert for half time, tape stops and stutters in time with the beat." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=376 label="PotentialPunch alone, on Break Smack, is a quick way to make a soft break hit." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=424 label="Effects go on the track's inserts. SAVE KIT saves the pads as you hear them in the plugin, before the track's" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=456 label="effects." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=240 label="GOOD TO KNOW" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=280 label="If pad 1 does not play the first slice, tap LEARN and then hit the pad you want as pad 1." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=312 label="Tempo comes from the file name when it has one, like Funky Drummer 101bpm.wav. Otherwise it is measured," size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=84 cy=344 label="between 80 and 160 BPM." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=376 label="Long tracks get a random 1, 2 or 4 bar loop cut from them, starting on a hit. Only the first 3 minutes of a" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=84 cy=408 label="file are used." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=440 label="Stretch mode does not time-stretch. At a slower tempo you hear small gaps between hits, the classic chopped" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=84 cy=472 label="sound." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=504 label="8 voices, 44.1 kHz playback." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=536 label="Q-Links: PITCH, VOLUME, CHOP, BARS, TEMPO and CHOKE." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=568 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=568 label="Looks: Print Plate, Night Rack or Colour Block, on the SETTINGS page." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=60 cy=616 label="Ideas, bugs and criticism are all welcome: github.com/PotentialBreakfast/mpc-vst-potentialbreaks" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
